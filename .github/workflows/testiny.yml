name: Playwright - Testiny Regression Plan

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/testiny.yml'
      - 'tools/testiny/**'
      - 'pages/saucedemo/**'
      - 'fixtures/saucedemo/**'
      - 'test-data/saucedemo/**'
      - 'tests/web tests/regression/saucedemo/**'
      - 'package*.json'
      - 'tsconfig.json'
      - 'playwright.config.ts'
  schedule:
    # 01:30 UTC: 02:30 winter / 03:30 summer in mainland Spain.
    - cron: '30 1 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: testiny-plan-1
  cancel-in-progress: false

jobs:
  regression:
    name: Testiny TP-1 - Chrome
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CI: 'true'
      QASE_MODE: 'off'
      TESTINY_PROJECT_ID: '1'
      TESTINY_PLAN_ID: '1'
      TESTINY_PLAYWRIGHT_PROJECT: ui-chrome
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.18.0'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate TypeScript
        run: npm run typecheck

      - name: Test Testiny integration without remote writes
        run: npm run test:testiny

      - name: Install Chrome
        run: npx playwright install --with-deps chrome

      - name: Read TP-1, execute its cases and publish results
        env:
          TESTINY_API_KEY: ${{ secrets.TESTINY_API_KEY }}
          SAUCEDEMO_PASSWORD: ${{ secrets.SAUCEDEMO_PASSWORD }}
        run: npm run testiny:run-plan

      - name: Upload local results and execution reference
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: testiny-plan-1-chrome
          path: test-results/testiny/
          retention-days: 7
          if-no-files-found: warn
